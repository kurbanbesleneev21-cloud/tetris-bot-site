<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Bot Web</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #fff; padding: 20px; text-align: center; }
        .container { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        pre { text-align: left; background: #000; padding: 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; font-size: 14px; }
        button { background: #0088cc; color: white; border: none; padding: 10px 16px; margin: 5px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        button:active { background: #006699; }
    </style>
</head>
<body>

<div class="container">
    <h2>Тетрис Бот</h2>
    <pre id="output">Загрузка данных...</pre>
    <div id="buttons"></div>
    <br>
    <button onclick="sendCommand('/start')">🔄 Начать /start</button>
</div>

<script>
    // Вставьте сюда URL вашего развернутого Python-сервера (с Render.com или Koyeb)
    const BACKEND_URL = "https://your-app-name.onrender.com"; 

    async function sendCommand(cmd) {
        document.getElementById('output').innerText = "Отправка команды...";
        try {
            const res = await fetch(`${BACKEND_URL}/send?cmd=${encodeURIComponent(cmd)}`, { method: 'POST' });
            const data = await res.json();
            render(data);
        } catch (e) {
            document.getElementById('output').innerText = "Ошибка подключения к бэкенду.";
        }
    }

    function render(data) {
        document.getElementById('output').innerText = data.text || "Нет ответа";
        const btnDiv = document.getElementById('buttons');
        btnDiv.innerHTML = '';

        if (data.buttons) {
            data.buttons.forEach(row => {
                row.forEach(btn => {
                    const b = document.createElement('button');
                    b.innerText = btn.text;
                    b.onclick = () => sendCommand(btn.text);
                    btnDiv.appendChild(b);
                });
                btnDiv.appendChild(document.createElement('br'));
            });
        }
    }

    // Авто-обновление каждые 3 секунды
    setInterval(async () => {
        try {
            const res = await fetch(`${BACKEND_URL}/get`);
            const data = await res.json();
            render(data);
        } catch(e) {}
    }, 3000);
</script>

</body>
</html>
